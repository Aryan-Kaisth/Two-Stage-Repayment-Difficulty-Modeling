[project]
name = "project-home-credit"
version = "0.1.0"
description = "this is two stage explainable and calibrated repayment difficulty prediction"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Aryan Kaisth"}
]
dependencies = [
    "catboost>=1.2.10",
    "databricks-sdk>=0.130.0",
    "docker>=7.2.0",
    "evidently>=0.7.21",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "missingno>=0.5.2",
    "mlflow>=2.20",
    "numba>=0.59",
    "numpy>=2.5.2",
    "pandas>=2.2,<3",
    "pandera>=0.32.1",
    "pytabkit>=1.7.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.46",
    "streamlit>=1.61.1",
    "tqdm>=4.70.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]